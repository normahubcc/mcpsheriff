name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    # ubuntu-latest moved to 26.04, which has no prebuilt Python 3.9 in the
    # setup-python manifest. Pin 3.9 to an image that still ships it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            os: ubuntu-22.04
          - python: '3.10'
            os: ubuntu-latest
          - python: '3.11'
            os: ubuntu-latest
          - python: '3.12'
            os: ubuntu-latest
          - python: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Self-check (mcpsheriff against the fake server)
        run: mcpsheriff run -- python tests/servers.py

  package:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/mcpsheriff version
          /tmp/venv/bin/mcpsheriff run -- python tests/servers.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/